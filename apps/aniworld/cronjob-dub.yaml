# Laedt woechentlich alle Folgen mit deutscher Synchro nach. Vorhandene
# Dateien ueberspringt aniworld; Folgen ohne German Dub werden ausgelassen
# und kommen automatisch, sobald die Synchro erscheint.
# Weitere Serien: URL an SERIES anhaengen (durch Leerzeichen getrennt).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aniworld-german-dub
  namespace: aniworld
spec:
  schedule: "0 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: pj
          enableServiceLinks: false
          containers:
            - name: download
              image: ghcr.io/phoenixthrush/aniworld-downloader:latest
              env:
                - name: TZ
                  value: Europe/Berlin
                - name: PYTHONPATH
                  value: /home/aniworld/.local/lib/python3.13/site-packages
                - name: SERIES
                  value: https://aniworld.to/anime/stream/one-piece
                - name: GOTIFY_URL
                  value: http://gotify.gotify.svc:80
                - name: GOTIFY_TOKEN
                  valueFrom:
                    secretKeyRef: {name: aniworld-gotify, key: GOTIFY_TOKEN}
              command: ["sh", "/scripts/run.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: anime
                  mountPath: /app/downloads
                  subPath: arr/Plex/Anime/Series
                - name: data
                  mountPath: /home/aniworld/.aniworld
                  subPath: aniworld-home
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: script
              configMap:
                name: aniworld-dub-script
            - name: anime
              nfs:
                server: 192.168.1.162
                path: /volume1/docker
            - name: data
              persistentVolumeClaim:
                claimName: aniworld-data
