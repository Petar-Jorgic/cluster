apiVersion: apps/v1
kind: Deployment
metadata:
  name: aniworld
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: aniworld
    app.kubernetes.io/part-of: aniworld
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aniworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aniworld
    spec:
      nodeSelector:
        kubernetes.io/hostname: pj
      containers:
        - name: aniworld
          image: ghcr.io/phoenixthrush/aniworld-downloader:latest
          command: ["sh", "-c", "pip install --upgrade aniworld && aniworld --web-ui --web-expose --web-port 8080 --web-force-sso -o /app/downloads"]
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: Europe/Berlin
            # Login nur ueber Pocket ID (SSO); Weboberflaeche ist auch oeffentlich erreichbar
            - name: ANIWORLD_OIDC_ISSUER_URL
              value: https://id.pj-home-lab.com
            - name: ANIWORLD_OIDC_DISPLAY_NAME
              value: Pocket ID
            - name: ANIWORLD_OIDC_ADMIN_USER
              value: petar
            # Traefik setzt X-Forwarded-Proto, damit die Callback-URL https ist
            - name: ANIWORLD_WEB_TRUSTED_PROXY
              value: "*"
          envFrom:
            - secretRef:
                name: aniworld-oidc
          volumeMounts:
            # Downloads landen direkt in Sonarrs/Jellyfins Anime-Ordner auf dem NAS
            - name: anime
              mountPath: /app/downloads
              subPath: arr/Plex/Anime/Series
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /home/aniworld/.aniworld
              subPath: aniworld-home
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: anime
          nfs:
            server: 192.168.1.162
            path: /volume1/docker
        - name: data
          persistentVolumeClaim:
            claimName: aniworld-data
