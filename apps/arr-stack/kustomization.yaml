apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arr-stack

resources:
  - deployment.yaml
  - sonarr.yaml
  - radarr.yaml
  - readarr.yaml
  - bindery.yaml
  - bazarr.yaml
  - jellyseerr.yaml
  - decypharr.yaml
