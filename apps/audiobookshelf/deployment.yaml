apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
    spec:
      nodeSelector:
        kubernetes.io/hostname: pj
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            # config (SQLite) + metadata (logs, cover cache) on local disk:
            # NFS export uses insecure_locks (unsafe for SQLite) and small
            # frequent writes to /metadata intermittently returned EACCES.
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            # media stays on the NAS
            - name: data
              mountPath: /audiobooks
              subPath: audiobooks
            - name: data
              mountPath: /podcasts
              subPath: podcasts
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audiobookshelf-data
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
