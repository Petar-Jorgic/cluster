apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-nfs-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-audiobookshelf
  nfs:
    server: 192.168.1.162
    path: /volume1/docker/audiobookshelf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-audiobookshelf
  resources:
    requests:
      storage: 100Gi
  volumeName: audiobookshelf-nfs-pv
---
# config (SQLite DB) and metadata (logs + cover cache) live on local disk, not NFS.
# NFS is exported with insecure_locks, which is unsafe for SQLite, and small
# high-frequency writes to /metadata intermittently failed with EACCES.
# Media (audiobooks, podcasts) stays on the NAS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: audiobookshelf
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: audiobookshelf
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
