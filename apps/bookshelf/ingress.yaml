apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookshelf
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: bookshelf
    app.kubernetes.io/part-of: bookshelf
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bookshelf.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookshelf
                port:
                  number: 8787
    - host: bookshelf.pj-home-lab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookshelf
                port:
                  number: 8787
