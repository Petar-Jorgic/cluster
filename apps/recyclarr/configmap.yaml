apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: recyclarr
data:
  recyclarr.yml: |
    sonarr:
      sonarr-main:
        base_url: http://sonarr.arr-stack.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # replaces the old `include: sonarr-quality-definition-series`
        quality_definition:
          type: series

        quality_profiles:
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # replaces the old `include: sonarr-v4-custom-formats-web-1080p`
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p

    radarr:
      radarr-main:
        base_url: http://radarr.arr-stack.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY

        # replaces the old `include: radarr-quality-definition-movie`
        quality_definition:
          type: movie

        quality_profiles:
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # replaces the old `include: radarr-custom-formats-hd-bluray-web`
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
              assign_scores_to:
                - name: HD-1080p
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p
