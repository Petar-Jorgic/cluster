apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: recyclarr
data:
  recyclarr.yml: |
    sonarr:
      sonarr-main:
        base_url: http://sonarr.arr-stack.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # replaces the old `include: sonarr-quality-definition-series`
        quality_definition:
          type: series

        quality_profiles:
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # replaces the old `include: sonarr-v4-custom-formats-web-1080p`
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f54985e5e96747cef58731f1cf4c9181  # [Streaming Services] Anime
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a  # [Streaming Services] Asian
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f60f4401ce880aad62e9d21c8bb6b91a  # [Streaming Services] Dutch
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 848fd356c200568fc5a6248150e7e7ea  # [Streaming Services] French
              assign_scores_to:
                - name: HD-1080p
            - trash_id: ddab3095a5d2f436f369263840af34f9  # [Streaming Services] UK
              assign_scores_to:
                - name: HD-1080p
            - trash_id: bad5bc85573a0134e1e1987c46f67e98  # [Optional] Accessibility
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f4a0410a1df109a66d6e47dcadcce014  # [Optional] Miscellaneous
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 7832db22b71ab669458c17a2850d6913  # [Streaming Services] Miscellaneous
              assign_scores_to:
                - name: HD-1080p

    radarr:
      radarr-main:
        base_url: http://radarr.arr-stack.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY

        # replaces the old `include: radarr-quality-definition-movie`
        quality_definition:
          type: movie

        quality_profiles:
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # replaces the old `include: radarr-custom-formats-hd-bluray-web`
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
              assign_scores_to:
                - name: HD-1080p
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f993ad37540147e4d00e66503545d81b  # [Streaming Services] Anime
              assign_scores_to:
                - name: HD-1080p
            - trash_id: b22449f789b16a4163b59f1b70cbc580  # [Streaming Services] Asian
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 088a792e0561c927fb396664b0db5c8f  # [Streaming Services] Dutch
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f737e18b5824d6ebb2d57b957ae2fd6c  # [Streaming Services] UK
              assign_scores_to:
                - name: HD-1080p
            - trash_id: bc3c13e52f2971319bc1748ffa3d1078  # [Optional] Accessibility
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 13856622cf7a6c9925d3a83f8812d679  # [Optional] Language Profiles
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 9337080378236ce4c0b183e35790d2a7  # [Optional] Miscellaneous
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 9fc645b3cef52b149ec13ba3972245d1  # [Streaming Services] Miscellaneous
              assign_scores_to:
                - name: HD-1080p
