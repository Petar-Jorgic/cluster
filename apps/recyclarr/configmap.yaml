apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: recyclarr
data:
  recyclarr.yml: |
    sonarr:
      sonarr-main:
        base_url: http://sonarr.arr-stack.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # replaces the old `include: sonarr-quality-definition-series`
        quality_definition:
          type: series

        quality_profiles:
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # replaces the old `include: sonarr-v4-custom-formats-web-1080p`
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
              assign_scores_to:
                - name: HD-1080p
              exclude:
                # Scores -10000 and would reject any non-original-language
                # release, i.e. every German dub. It is this group's only
                # default CF, so the German entries below are opted in
                # explicitly to keep the group meaningful.
                - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original
              select:
                - 8a9fcdbb445f2add0505926df3bb7b8a  # German
                - ed51973a811f51985f14e2f6f290e47a  # German DL
                - c5dd0fd675f85487ad5bdf97159180bd  # German DL (undefined)
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f54985e5e96747cef58731f1cf4c9181  # [Streaming Services] Anime
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a  # [Streaming Services] Asian
              assign_scores_to:
                - name: HD-1080p
            - trash_id: f60f4401ce880aad62e9d21c8bb6b91a  # [Streaming Services] Dutch
              assign_scores_to:
                - name: HD-1080p
            - trash_id: 848fd356c200568fc5a6248150e7e7ea  # [Streaming Services] French
              assign_scores_to:
                - name: HD-1080p
            - trash_id: ddab3095a5d2f436f369263840af34f9  # [Streaming Services] UK
              assign_scores_to:
                - name: HD-1080p
            - trash_id: bad5bc85573a0134e1e1987c46f67e98  # [Optional] Accessibility
              assign_scores_to:
                - name: HD-1080p
              select:
                - 44ccbcbc74506f208973e1463b11705f  # WiTH AD
                - c196536ea8122397c5854040d01f2aa7  # WiTH ASL
                - b40dc2e630723745aab9f1b94f4aab74  # WiTH BASL
                - 0aef382c4ed4c5eb5d40109dfd351b72  # WiTH BSL
            - trash_id: f4a0410a1df109a66d6e47dcadcce014  # [Optional] Miscellaneous
              assign_scores_to:
