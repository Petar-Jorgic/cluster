apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracearr
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tracearr
    app.kubernetes.io/part-of: tracearr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tracearr.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr
                port:
                  number: 3000
    - host: tracearr.pj-home-lab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr
                port:
                  number: 3000
