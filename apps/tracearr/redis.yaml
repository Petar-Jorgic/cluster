apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr-redis
  labels:
    app.kubernetes.io/name: tracearr-redis
    app.kubernetes.io/part-of: tracearr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracearr-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracearr-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: pj
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8-alpine
          # BullMQ braucht noeviction, sonst verwirft Redis Jobs unter Druck.
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracearr-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: tracearr-redis
  labels:
    app.kubernetes.io/part-of: tracearr
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: tracearr-redis
